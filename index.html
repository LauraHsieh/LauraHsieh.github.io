<script type="module">
/* ============================================================
   Level 0 · 刷・揮・塗・抹・擦
   用手在字上來回「刷」，亮綠色會一層一層慢慢刷滿整個字
   ============================================================ */
const MP_VERSION = '0.10.14';
const MP_BUNDLE  = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`;
const MP_WASM    = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`;
const MP_MODEL   = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
 
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';
const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[1,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                     [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const CHARS = ['刷', '揮', '塗', '抹', '擦'];
// 「刷」改用角色圖片（放在 tree-game 資料夾）；其他字仍用文字
const CHAR_IMAGES = { '刷': './tree-game/刷.png' };
const charImgs = {};   // 載入並去背、裁掉空白邊後的圖片
const outlineC = document.createElement('canvas'), octx = outlineC.getContext('2d');   // 圖片字的外框線
 
const GREEN      = '60,220,90';  // 亮綠色
const BASE_COLOR = '#e2e2e2';    // 還沒刷到的字（無邊框，淺灰）
const PER_PASS   = 0.3;          // 刷過一次大約上色 30%，來回刷幾次才會滿
const MIN_SPEED  = 260;          // 手移動速度（px/秒）超過這個才算在「刷」，停著不動不會上色
const DONE_AT    = 0.85;         // 刷滿 85% 後，剩下的自動補滿
const GRID       = 64;           // 計算刷滿程度用的格子數
const HEADER_OFFSET = 60;   // 往下移，留空間給工具列、五個字的切換鈕與黃色小手
 
const $ = s => document.querySelector(s);
 
/* 效能：平板／手機（觸控裝置，含 iPad）效能較弱，降低畫布解析度、圖片處理尺寸，並在偵測變慢時自動放慢偵測頻率 */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || /iPad|iPhone|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1);
const MAX_DPR = IS_TOUCH ? 1.25 : 2;
let lastDetectT = 0, detectAvg = 0, detectGap = 0;
const canvas = $('#stage'), ctx = canvas.getContext('2d');
const video = $('#cam'), dots = $('#dots'), dctx = dots.getContext('2d');
const hintEl = $('#handHint');
const tabs = [...document.querySelectorAll('.char-tab')];
const dotEls = [...document.querySelectorAll('#dots5 .dot')];
 
let W = 0, H = 0, DPR = 1, glyphSize = 300, S = 360, brushR = 30;
let cameraOn = false, handLandmarker = null, lastVideoTime = -1;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = k => 1 - Math.pow(1 - k, 3);
 
/* 手部游標圖層（疊在按鈕之上） */
const curCanvas = $('#cursor'), cctx = curCanvas.getContext('2d');
function drawCursor(x, y, big) {
  const rOuter = big ? 38 : 28;
  const gOuter = cctx.createRadialGradient(x, y, 0, x, y, rOuter);
  gOuter.addColorStop(0, 'rgba(245, 160, 60, 0.7)');
  gOuter.addColorStop(1, 'rgba(245, 160, 60, 0)');
  cctx.fillStyle = gOuter;
  cctx.fillRect(x - rOuter, y - rOuter, rOuter * 2, rOuter * 2);
  const rInner = big ? 8 : 6;
  const gInner = cctx.createRadialGradient(x, y, 0, x, y, rInner);
  gInner.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gInner.addColorStop(1, 'rgba(255, 255, 255, 0)');
  cctx.fillStyle = gInner;
  cctx.fillRect(x - rInner, y - rInner, rInner * 2, rInner * 2);
}
 
/* ============================================================
   字與刷色圖層
   maskC：字的形狀；paintC：刷上去的綠色；tmpC：兩者相交後的結果
   ============================================================ */
const maskC = document.createElement('canvas'), mctx = maskC.getContext('2d');
const paintC = document.createElement('canvas'), pctx = paintC.getContext('2d');
const tmpC = document.createElement('canvas'), tctx = tmpC.getContext('2d');
let ci = 0;                       // 目前的字
let cellIn = null, cellAmt = null, cellCount = 1;
let coverage = 0, done = false, doneT = 0;
const doneSet = new Set();
let autoNextAt = 0;              // 完成一個字後，自動換下一個字的時間
const sparks = [];
 
const glyphCenter = () => ({ x: W / 2, y: H / 2 + HEADER_OFFSET });
const boxLeft = () => glyphCenter().x - S / 2;
const boxTop  = () => glyphCenter().y - S / 2;
 
function layout() {
  DPR = Math.min(MAX_DPR, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  curCanvas.width = canvas.width; curCanvas.height = canvas.height;
  glyphSize = Math.min(W * 0.5, H * 0.4);
  S = Math.ceil(glyphSize * 1.15);
  brushR = glyphSize * 0.09;
  for (const c of [maskC, paintC, tmpC]) { c.width = c.height = Math.ceil(S * DPR); }
  // 黃色小手放在字的正上方
  hintEl.style.left = (W / 2) + 'px';
  hintEl.style.top = Math.max(130, glyphCenter().y - glyphSize * 0.5 - 70) + 'px';
  setupChar(ci);
}
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });
 
// 把圖片等比例放進字的區域（S × S 的正中央）
function imageRect(img) {
  const box = glyphSize * 1.05;
  const sc = Math.min(box / img.width, box / img.height);
  const w = img.width * sc, h = img.height * sc;
  return { x: (S - w) / 2, y: (S - h) / 2, w, h };
}
 
// 去背：從圖片四邊往內找「白色或透明」的背景並變成透明（字裡面的白色眼睛等不受影響），回傳去背後的畫布與角色範圍
function removeBackground(img) {
  // 原圖很大（例如 3508×2481）時先縮小再處理，避免畫面卡住；2000px 在 Retina 螢幕上也夠清楚
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const sc = Math.min(1, (IS_TOUCH ? 1400 : 2000) / Math.max(iw, ih));
  const w = Math.round(iw * sc), h = Math.round(ih * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, w, h);
  const id = x.getImageData(0, 0, w, h), d = id.data;   // 用 file:// 開啟時這裡可能讀不到像素而丟出錯誤
  const isBg = k => { const i = k * 4; return d[i + 3] < 30 || (d[i] > 225 && d[i + 1] > 225 && d[i + 2] > 225); };
  const bg = new Uint8Array(w * h), stack = new Int32Array(w * h); let sp = 0;
  const push = k => { if (!bg[k] && isBg(k)) { bg[k] = 1; stack[sp++] = k; } };
  for (let xx = 0; xx < w; xx++) { push(xx); push((h - 1) * w + xx); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) {
    const k = stack[--sp], px = k % w;
    if (px > 0) push(k - 1); if (px < w - 1) push(k + 1);
    if (k >= w) push(k - w); if (k < w * (h - 1)) push(k + w);
  }
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let k = 0; k < w * h; k++) {
    if (bg[k]) { d[k * 4 + 3] = 0; continue; }
    const px = k % w, py = (k - px) / w;
    if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
  }
  x.putImageData(id, 0, 0);
  return { canvas: c, box: x1 < 0 ? { x0: 0, y0: 0, x1: w - 1, y1: h - 1 } : { x0, y0, x1, y1 } };
}
// 依範圍裁切，並補上 naturalWidth / naturalHeight，讓其餘程式可以把它當圖片用
function cropCanvas(c, box, pad = 4) {
  const sx = Math.max(0, box.x0 - pad), sy = Math.max(0, box.y0 - pad);
  const out = document.createElement('canvas');
  out.width = Math.min(c.width, box.x1 + pad + 1) - sx; out.height = Math.min(c.height, box.y1 + pad + 1) - sy;
  out.getContext('2d').drawImage(c, sx, sy, out.width, out.height, 0, 0, out.width, out.height);
  out.naturalWidth = out.width; out.naturalHeight = out.height;
  return out;
}
// 去背並裁掉四周空白；讀不到像素時就用原圖
function prepareImage(img) {
  try { const r = removeBackground(img); return cropCanvas(r.canvas, r.box); }
  catch (err) { console.warn('無法讀取圖片像素（請用 Live Server 開啟）：', err); return img; }
}
 
function drawGlyphText(c2d, color) {
  c2d.font = `900 ${glyphSize}px ${FONT}`;
  c2d.textAlign = 'center'; c2d.textBaseline = 'middle';
  c2d.fillStyle = color;
  c2d.fillText(CHARS[ci], S / 2, S / 2 + glyphSize * 0.03);
}
 
function setupChar(i) {
  ci = i;
  tabs.forEach((t, k) => t.classList.toggle('active', k === ci));
  dotEls.forEach((d, k) => { d.classList.toggle('active', k === ci); d.classList.toggle('done', doneSet.has(k)); });
 
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0); mctx.clearRect(0, 0, S, S);
  const img = charImgs[CHARS[ci]];
  if (img) {
    // 圖片字：範圍＝整個角色（去背後的形狀）
    const r = imageRect(img);
    mctx.drawImage(img, r.x, r.y, r.w, r.h);
    // 外框線：把角色形狀往四周擴張一點塗成深灰，再挖掉角色本身，只留下一圈線
    outlineC.width = outlineC.height = maskC.width;
    octx.setTransform(DPR, 0, 0, DPR, 0, 0); octx.clearRect(0, 0, S, S);
    const lw = Math.max(2, glyphSize * 0.012);
    for (let k = 0; k < 16; k++) {
      const a = k / 16 * Math.PI * 2;
      octx.drawImage(img, r.x + Math.cos(a) * lw, r.y + Math.sin(a) * lw, r.w, r.h);
    }
    octx.globalCompositeOperation = 'source-in';
    octx.fillStyle = '#333333'; octx.fillRect(0, 0, S, S);

    const r = img ? imageRect(img) : { x: (S - glyphSize) / 2, y: (S - glyphSize) / 2, w: glyphSize, h: glyphSize };

/* 從 (x0,y0) 刷到 (x1,y1)：沿路上色（只會留在字的範圍內），並累計刷滿程度 */
function brushSegment(x0, y0, x1, y1) {

  if (ci < CHARS.length - 1) autoNextAt = doneT + 1600;

function detectHands() {

function drawPreview(lm) {

let mouseDown = false;
canvas.addEventListener('pointerdown', e => { if (handFromCam) return; mouseDown = true; lastHand = null; handMove(e.clientX, e.clientY, performance.now()); });

/* ============================================================
   按鈕
   ============================================================ */
tabs.forEach((t, k) => t.addEventListener('click', () => { demo = null; setupChar(k); }));
$('#btnReset').addEventListener('click', () => { demo = null; doneSet.delete(ci); setupChar(ci); });
$('#btnNext').addEventListener('click', () => { demo = null; setupChar((ci + 1) % CHARS.length); });
 
// 試揮一下：自動示範來回刷幾下
let demo = null;

/* ============================================================
   回選關：按「選關」，或手部游標停在「選關」上 0.5 秒
   ============================================================ */
let leaving = false;
function goBackToMenu() {

// 手部游標停在任何按鈕上 0.5 秒 → 觸發該按鈕（同一顆按鈕要先移開才會再觸發一次）

function checkButtonHover(now, pts) {

  for (const p of pts) {

   ============================================================ */
const $ = s => document.querySelector(s);
 
/* 效能：平板／手機（觸控裝置，含 iPad）效能較弱，降低畫布解析度、圖片處理尺寸，並在偵測變慢時自動放慢偵測頻率 */

const video = $('#cam'), dots = $('#dots'), dctx = dots.getContext('2d');
 
/* 手部游標圖層（疊在「回選關」等按鈕之上） */
const curCanvas = $('#cursor'), cctx = curCanvas.getContext('2d');

function drawCursor(x, y, big) {
  const rOuter = big ? 38 : 28;
  const gOuter = cctx.createRadialGradient(x, y, 0, x, y, rOuter);
  gOuter.addColorStop(0, 'rgba(245, 160, 60, 0.7)');
  gOuter.addColorStop(1, 'rgba(245, 160, 60, 0)');
  cctx.fillStyle = gOuter;
  cctx.fillRect(x - rOuter, y - rOuter, rOuter * 2, rOuter * 2);
  const rInner = big ? 8 : 6;
  const gInner = cctx.createRadialGradient(x, y, 0, x, y, rInner);
  gInner.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gInner.addColorStop(1, 'rgba(255, 255, 255, 0)');

let W = 0, H = 0, DPR = 1, glyphSize = 400;
let STAGE_IMAGES = [];
let idx = 0, curEyeIdx = 0;
let sens = 0.85;
let lastChop = -1e9;
let samples = [], trail = [], unitEMA = 0;
let handSeen = -1e9, hx = 0, hy = 0;
let pointerDown = false;
let handLandmarker = null, lastVideoTime = -1, cameraOn = false;
let nextBlink = 0, blinkUntil = 0;
 
const slashes = [], ghosts = [], chips = [], rings = [];
let flash = 0, shake = 0, impact = null;
 
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
 
/* ============================================================
   版面
   ============================================================ */
function layout(first) {
  DPR = Math.min(MAX_DPR, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  sizeCursorLayer();
  glyphSize = Math.min(W * 0.8, H * 0.66);
}
 
function imageBox(img) {
  const scale = Math.min(glyphSize / img.naturalWidth, glyphSize / img.naturalHeight);
  const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
  // 往下偏移 50px，避開上方工具列（維持 Level 1 原本的版面位置）
  return { x: (W - w) / 2, y: (H - h) / 2 + 50, w, h };

/* ============================================================
   「砍」動作處理
   ============================================================ */
function chop(dx, dy, mx, my) {
  const now = performance.now();
  lastChop = now; samples.length = 0;
  const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const nx = -dy, ny = dx;
 
  const gx = W / 2, gy = H / 2 + 50;
  const lim = glyphSize * 0.26;
  const off = clamp((mx - gx) * nx + (my - gy) * ny, -lim, lim);
  const cx = gx + nx * off, cy = gy + ny * off;
  const half = glyphSize * 0.95;
 
  slashes.push({ ax: cx - dx * half, ay: cy - dy * half, bx: cx + dx * half, by: cy + dy * half, t0: now });
  const ghostImg = curEyeIdx === 0 ? STAGE_IMAGES[idx].open : STAGE_IMAGES[idx].closed;
  ghosts.push({ img: ghostImg, box: imageBox(ghostImg), cx, cy, dx, dy, t0: now });
  rings.push({ x: cx, y: cy, t0: now });
  impact = { x: cx, y: cy, t0: now };
 
  const tones = ['236,217,177', '240,169,74', '200,160,105', '147,196,125'];
  for (let j = 0; j < 130; j++) {
    const t = Math.random();
    const x = cx - dx * half + dx * half * 2 * t;
    const y = cy - dy * half + dy * half * 2 * t;
    const sp = rand(4, 15), sg = Math.random() < .5 ? -1 : 1;
    chips.push({
      x, y,
      vx: nx * sg * sp * rand(.5, 1.1) + dx * rand(-.5, .5) * sp,
      vy: ny * sg * sp * rand(.5, 1.1) + dy * rand(-.5, .5) * sp - rand(0, 3),
      rot: rand(0, 6.28), vr: rand(-.35, .35),
      w: rand(3, 9), h: rand(1.5, 3.2),
      life: 0, max: rand(650, 1300),
      col: tones[(Math.random() * tones.length) | 0]
    });
  }

  idx = (idx + 1) % STAGE_COUNT;

/* ============================================================
   揮手偵測
   ============================================================ */
function pushSample(t, cx, cy, unit, sx, sy) {
  handSeen = t; hx = sx; hy = sy;

/* 骨架平滑：One Euro Filter。只作用在預覽骨架的繪製，不影響揮手偵測與砍的判斷。 */
const SKEL_MIN_CUTOFF = 1.5;
const SKEL_BETA       = 40;
const SKEL_D_CUTOFF   = 1.0;

    skelLastT = t;

  const dt = Math.max(1e-3, t - skelLastT); skelLastT = t;

function detectHands() {

function drawPreview(lm) {

/* ============================================================
   物理模擬
   ============================================================ */
function update(f, now) {

/* ============================================================

const easeOut = k => 1 - Math.pow(1 - k, 3);

    const curImg = curEyeIdx === 0 ? STAGE_IMAGES[idx].open : STAGE_IMAGES[idx].closed;

  drawImpact(now);

function drawGhosts(now) {
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i], age = now - g.t0;

      ctx.beginPath(); ctx.rect(-4000, side > 0 ? 0 : -4000, 8000, 4000); ctx.clip();

      ctx.restore();
    }
  }

function drawChips() {

    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = `rgba(${c.col},${Math.min(1, a * 1.4)})`;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);

function drawRings(now) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], age = now - r.t0;
    if (age > 600) { rings.splice(i, 1); continue; }
    const k = age / 600;
    ctx.strokeStyle = `rgba(240,169,74,${0.55 * (1 - k)})`;
    ctx.lineWidth = 0.6 + 4 * (1 - k);

function drawImpact(now) {

  const k = age / 320, rad = glyphSize * (0.25 + 0.45 * easeOut(k));

  g.addColorStop(0, `rgba(255,214,150,${0.45 * (1 - k)})`);
  g.addColorStop(0.4, `rgba(240,169,74,${0.22 * (1 - k)})`);

function drawSlashes(now) {

      [36, `rgba(147,196,125,${0.14 * fade})`],
      [13, `rgba(240,169,74,${0.42 * fade})`],

function drawHand(now) {

/* ============================================================
   主循環
   ============================================================ */
let last = performance.now();

  update(f, now);
  render(now);
  checkButtonHover(now, now - handSeen < 140 ? [{ x: hx, y: hy }] : []);
  requestAnimationFrame(frame);

/* ============================================================
   回選關：按下按鈕，或手部游標停在「回選關」上 0.5 秒
   ============================================================ */
let leaving = false;
function goBackToMenu() {
  if (leaving) return;
  leaving = true;
  if (window.parent && window.parent !== window) window.parent.postMessage('back-to-menu', '*');
  else location.reload();
}
window.goBackToMenu = goBackToMenu;
// 手部游標停在任何按鈕上 0.5 秒 → 觸發該按鈕（同一顆按鈕要先移開才會再觸發一次）
let hoverBtn = null, hoverStart = 0, hoverFired = false;
function checkButtonHover(now, pts) {
  if (leaving) return;
  let hit = null;
  const btns = document.querySelectorAll('.header-bar button, .char-tab');
  for (const p of pts) {
    for (const b of btns) {
      const r = b.getBoundingClientRect(), pad = 8;
      if (p.x >= r.left - pad && p.x <= r.right + pad && p.y >= r.top - pad && p.y <= r.bottom + pad) { hit = b; break; }
    }
    if (hit) break;
  }
  if (hit !== hoverBtn) { hoverBtn = hit; hoverStart = now; hoverFired = false; }
  if (!hit || hoverFired) return;
  if (now - hoverStart > 500) { hoverFired = true; hit.click(); }

/* ============================================================
   操作事件（滑鼠拖曳、空白鍵也能砍）
   ============================================================ */
canvas.addEventListener('pointerdown', e => { pointerDown = true; samples.length = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!pointerDown) return;
  const u = 0.12 * Math.min(W, H);

});
const endPointer = () => { pointerDown = false; samples.length = 0; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
 
addEventListener('keydown', e => {
  if (e.code === 'Space' && STAGE_IMAGES.length) {
    e.preventDefault();
    if (performance.now() - lastChop > COOLDOWN) chop((Math.random() - .5) * 1.4, 1, W / 2, H / 2);
  }
});
 
// 試劈一下：自動劈一刀；重新玩：回到「森」重新開始
$('#btnTry').addEventListener('click', () => {
  if (STAGE_IMAGES.length && performance.now() - lastChop > COOLDOWN) chop((Math.random() - .5) * 1.4, 1, W / 2, H / 2 + 50);
});
$('#btnReset').addEventListener('click', () => { if (STAGE_IMAGES.length) begin(); });
 
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (STAGE_IMAGES.length) layout(false); }, 150); });
 
/* ============================================================
   MediaPipe 攝影機（從選關畫面進來後自動開啟，不需再按按鈕）
   ============================================================ */
async function initHands() {
  const { HandLandmarker, FilesetResolver } = await import(MP_BUNDLE);
  const fileset = await FilesetResolver.forVisionTasks(MP_WASM);
  const opts = delegate => ({
    baseOptions: { modelAssetPath: MP_MODEL, delegate },
    runningMode: 'VIDEO', numHands: 1,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { handLandmarker = await HandLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch { handLandmarker = await HandLandmarker.createFromOptions(fileset, opts('CPU')); }
}
 
function getSharedStream() {
  try {
    const st = window.parent && window.parent !== window && window.parent.getCameraStream && window.parent.getCameraStream();
    return st && st.active ? st : null;
  } catch { return null; }
}
async function initCamera() {
  // 優先沿用選關畫面已經開啟的鏡頭，進入每個關卡時就不會再跳出「允許使用相機」的詢問
  const shared = getSharedStream();
  const stream = shared || await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  cameraOn = true;
}
 
function begin() {
  idx = 0; curEyeIdx = 0;
  nextBlink = performance.now() + rand(1800, 3200);
  blinkUntil = 0;
}
 
// 去背：從圖片四邊往內找「白色或透明」的背景並變成透明（字裡面的白色眼睛等不受影響），回傳去背後的畫布與角色範圍
function removeBackground(img) {

  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const sc = Math.min(1, (IS_TOUCH ? 1400 : 2000) / Math.max(iw, ih));

  const push = k => { if (!bg[k] && isBg(k)) { bg[k] = 1; stack[sp++] = k; } };
  for (let xx = 0; xx < w; xx++) { push(xx); push((h - 1) * w + xx); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) {
    const k = stack[--sp], px = k % w;
    if (px > 0) push(k - 1); if (px < w - 1) push(k + 1);
    if (k >= w) push(k - w); if (k < w * (h - 1)) push(k + w);
  }
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let k = 0; k < w * h; k++) {
    if (bg[k]) { d[k * 4 + 3] = 0; continue; }
    const px = k % w, py = (k - px) / w;
    if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
  }
  x.putImageData(id, 0, 0);
  return { canvas: c, box: x1 < 0 ? { x0: 0, y0: 0, x1: w - 1, y1: h - 1 } : { x0, y0, x1, y1 } };
}
// 依範圍裁切，並補上 naturalWidth / naturalHeight，讓其餘程式可以把它當圖片用
function cropCanvas(c, box, pad = 4) {
  const sx = Math.max(0, box.x0 - pad), sy = Math.max(0, box.y0 - pad);
  const out = document.createElement('canvas');
  out.width = Math.min(c.width, box.x1 + pad + 1) - sx; out.height = Math.min(c.height, box.y1 + pad + 1) - sy;
  out.getContext('2d').drawImage(c, sx, sy, out.width, out.height, 0, 0, out.width, out.height);
  out.naturalWidth = out.width; out.naturalHeight = out.height;
  return out;
}
function prepareStageImages(list) {
  try {
    const rs = list.map(removeBackground);
    const sameSize = rs.every(r => r.canvas.width === rs[0].canvas.width && r.canvas.height === rs[0].canvas.height);
    if (!sameSize) return rs.map(r => cropCanvas(r.canvas, r.box));   // 畫布大小不同時，各自裁切
    const u = { x0: Math.min(...rs.map(r => r.box.x0)), y0: Math.min(...rs.map(r => r.box.y0)),
                x1: Math.max(...rs.map(r => r.box.x1)), y1: Math.max(...rs.map(r => r.box.y1)) };
    return rs.map(r => cropCanvas(r.canvas, u));
  } catch (err) {
    console.warn('無法讀取圖片像素（請用 Live Server 開啟），使用原圖：', err);
    return list;
  }
}
 
function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
 
/* ============================================================
   啟動
   ============================================================ */
(async () => {
  try {
    const [so, sc, lo, lc, mo, mc] = await Promise.all([
      loadImg(IMG_SEN_OPEN), loadImg(IMG_SEN_CLOSED),
      loadImg(IMG_LIN_OPEN), loadImg(IMG_LIN_CLOSED),
      loadImg(IMG_MU_OPEN),  loadImg(IMG_MU_CLOSED)
    ]);
    // 三張圖去背後，用「同一個裁切框」裁掉四周空白：
    // 森的大小剛好填滿畫面，林、木裡的每棵樹跟森裡的樹一樣大，三個字在畫面上的比例一致
    const [sen, lin, mu] = prepareStageImages([so, lo, mo]);
    STAGE_IMAGES = [{ open: sen, closed: sen }, { open: lin, closed: lin }, { open: mu, closed: mu }];
  } catch (err) {
    console.error('角色圖片載入失敗，請確認 tree-game 資料夾與 HTML 檔放在同一目錄。', err);
    return;
  }
  layout(true);
  requestAnimationFrame(frame);
  begin();
  try {
    await initHands();
    await initCamera();
  } catch (err) {
    console.error('鏡頭或手部偵測啟動失敗（仍可用滑鼠拖曳或空白鍵試玩）：', err);
  }
})();
</script>

<script type="module">
/* ============================================================
   Level 2 · 概念合成 —— 核心玩法來自 moon white.html（日 ＋ 月 → 明）
   （套用目前的 UI：白底、上方工具列、提示文字、分頁點、
     左下角視訊視窗、橘黃色發光游標＋白色中心點）
   ============================================================ */
const MP_VERSION = '0.10.14';
const MP_BUNDLE  = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`;
const MP_WASM    = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`;
const MP_MODEL   = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
 
const FONT = '"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif';
const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                     [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
 
const PINCH_ON  = 0.32;   // 手指距離 / 手掌長度，小於這個算捏合
const PINCH_OFF = 0.42;   // 大於這個才算放開（避免抖動）
const SPRING    = 0.05;   // 未被抓住時，回到定位的彈力
const DAMP      = 0.90;   // 自由飛行時的阻尼
const FOLLOW    = 0.30;   // 被抓住時跟隨手指的速度
const DWELL_MS  = 140;    // 兩字靠近後要維持多久才觸發合成
const DRAW_IN   = 380;    // 合成動畫第一階段（拉近、模糊、發光）
const FLASH_T   = 200;    // 合成動畫第二階段（閃光、火花）
const SPLIT_COOLDOWN = 500;
const HEADER_OFFSET = 40; // 字的位置往下移，避開上方工具列
 
const $ = s => document.querySelector(s);
 
/* 效能：平板／手機（觸控裝置，含 iPad）效能較弱，降低畫布解析度、圖片處理尺寸，並在偵測變慢時自動放慢偵測頻率 */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || /iPad|iPhone|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1);
const MAX_DPR = IS_TOUCH ? 1.25 : 2;
let lastDetectT = 0, detectAvg = 0, detectGap = 0;
const canvas = $('#stage'), ctx = canvas.getContext('2d');
const video = $('#cam'), dots = $('#dots'), dctx = dots.getContext('2d');
 
/* 手部游標圖層（疊在「回選關」等按鈕之上） */
const curCanvas = $('#cursor'), cctx = curCanvas.getContext('2d');
function sizeCursorLayer() { curCanvas.width = Math.round(W * DPR); curCanvas.height = Math.round(H * DPR); }
function clearCursorLayer() { cctx.setTransform(DPR, 0, 0, DPR, 0, 0); cctx.clearRect(0, 0, W, H); }
// 發光的橘黃色游標＋白色中心點；big 時（例如捏合）稍微放大
function drawCursor(x, y, big) {
  const rOuter = big ? 38 : 28;
  const gOuter = cctx.createRadialGradient(x, y, 0, x, y, rOuter);
  gOuter.addColorStop(0, 'rgba(245, 160, 60, 0.7)');
  gOuter.addColorStop(1, 'rgba(245, 160, 60, 0)');
  cctx.fillStyle = gOuter;
  cctx.fillRect(x - rOuter, y - rOuter, rOuter * 2, rOuter * 2);
  const rInner = big ? 8 : 6;
  const gInner = cctx.createRadialGradient(x, y, 0, x, y, rInner);
  gInner.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gInner.addColorStop(1, 'rgba(255, 255, 255, 0)');
  cctx.fillStyle = gInner;
  cctx.fillRect(x - rInner, y - rInner, rInner * 2, rInner * 2);
}
 
let W = 0, H = 0, DPR = 1, glyphSize = 300;
let cameraOn = false, handLandmarker = null, lastVideoTime = -1;
 
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
 
/* ============================================================
   兩個字的物件：日、月
   ============================================================ */
const sun  = { ch: '日', x: 0, y: 0, vx: 0, vy: 0, heldBy: null, glow: 'amber',     phase: rand(0, 6.28), visible: true };
const moon = { ch: '月', x: 0, y: 0, vx: 0, vy: 0, heldBy: null, glow: 'moonlight', phase: rand(0, 6.28), visible: true };
 
let mergeState = 'idle';   // idle | dwell | drawin | flash | formed | splitting
let mergeT0 = 0, dwellT = 0, lastSplit = -1e9;
let flash = 0, shake = 0;
const rings = [], sparks = [];
 
function homePositions() {
  sun.baseX  = W * 0.30; sun.baseY  = H * 0.5 + HEADER_OFFSET;
  moon.baseX = W * 0.70; moon.baseY = H * 0.5 + HEADER_OFFSET;
}
 
function layout() {
  DPR = Math.min(MAX_DPR, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  sizeCursorLayer();
  glyphSize = Math.min(W, H) * 0.34;
  homePositions();
  buildSprites();
}
 
function resetScene() {
  homePositions();
  sun.x = sun.baseX; sun.y = sun.baseY; sun.vx = sun.vy = 0; sun.visible = true; sun.heldBy = null;
  moon.x = moon.baseX; moon.y = moon.baseY; moon.vx = moon.vy = 0; moon.visible = true; moon.heldBy = null;
  for (const s of Object.values(slots)) s.held = null;
  mergeState = 'idle'; dwellT = 0; flash = 0; shake = 0;
  rings.length = 0; sparks.length = 0;
}
 
/* ============================================================
   抓取用的「輸入槽」：滑鼠一個，雙手各一個，邏輯共用
   ============================================================ */
const slots = { mouse: mkSlot(), h0: mkSlot(), h1: mkSlot() };
function mkSlot() {
  return { active: false, x: 0, y: 0, px: 0, py: 0, pt: 0, vx: 0, vy: 0, held: null, pinching: false, seen: -1e9 };
}
 
function grabRadius() { return glyphSize * 0.62; }
 
function tryGrab(slot) {
  if (slot.held) return;
  const candidates = [];
  if (mergeState === 'idle' || mergeState === 'dwell') {
    if (sun.visible && !sun.heldBy) candidates.push(sun);
    if (moon.visible && !moon.heldBy) candidates.push(moon);
  }
  let best = null, bd = grabRadius();
  for (const o of candidates) {
    const d = Math.hypot(o.x - slot.x, o.y - slot.y);
    if (d < bd) { bd = d; best = o; }
  }
  if (best) { best.heldBy = slot; slot.held = best; }
}
 
function releaseSlot(slot) {
  if (slot.held) {
    slot.held.heldBy = null;
    slot.held.vx = clamp(slot.vx, -60, 60);
    slot.held.vy = clamp(slot.vy, -60, 60);
    slot.held = null;
  }
}
 
function updateSlotVelocity(slot, now) {
  const dt = (now - slot.pt) / 1000;
  if (dt > 0.001 && dt < 0.25) {
    const nvx = (slot.x - slot.px) / dt, nvy = (slot.y - slot.py) / dt;
    slot.vx = slot.vx * 0.5 + nvx * 0.5;
    slot.vy = slot.vy * 0.5 + nvy * 0.5;
  }
  slot.px = slot.x; slot.py = slot.y; slot.pt = now;
}
 
/* ============================================================
   滑鼠／觸控輸入（沒有鏡頭也能拖曳試玩）
   ============================================================ */
canvas.addEventListener('pointerdown', e => {
  const s = slots.mouse;
  s.x = e.clientX; s.y = e.clientY; s.px = s.x; s.py = s.y; s.pt = performance.now();
  s.active = true; canvas.setPointerCapture(e.pointerId);
  tryGrab(s); maybeGrabSplit(s);
});
canvas.addEventListener('pointermove', e => {
  const s = slots.mouse;
  if (!s.active) return;
  s.x = e.clientX; s.y = e.clientY;
});
function endMouse() { const s = slots.mouse; s.active = false; releaseSlot(s); }
canvas.addEventListener('pointerup', endMouse);
canvas.addEventListener('pointercancel', endMouse);
 
$('#btnReset').addEventListener('click', () => resetScene());
 
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });
 
/* ============================================================
   合成序列
   ============================================================ */
function burstLight(cx, cy, n, warm) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), sp = rand(3, 13);
    sparks.push({
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0, 2),
      life: 0, max: rand(500, 1050), size: rand(1.6, 4.2),
      warm: warm !== undefined ? warm : Math.random() < 0.6
    });
  }
  if (sparks.length > 500) sparks.splice(0, sparks.length - 500);
}
 
function startMerge(now) {
  mergeState = 'drawin'; mergeT0 = now;
  releaseSlot(slots.mouse); releaseSlot(slots.h0); releaseSlot(slots.h1);
}
 
function updateMerge(now, f) {
  const cx = (sun.x + moon.x) / 2, cy = (sun.y + moon.y) / 2;
 
  if (mergeState === 'dwell') {
    if (dist(sun, moon) < mergeThreshold()) {
      dwellT += f * 16.7;
      if (dwellT > DWELL_MS) startMerge(now);
    } else { dwellT = 0; mergeState = 'idle'; }
  }
 
  if (mergeState === 'drawin') {
    const k = clamp((now - mergeT0) / DRAW_IN, 0, 1), e = easeOut(k);
    sun.x  += (cx - glyphSize * 0.12 - sun.x)  * 0.16 * f;
    sun.y  += (cy - sun.y) * 0.16 * f;
    moon.x += (cx + glyphSize * 0.12 - moon.x) * 0.16 * f;
    moon.y += (cy - moon.y) * 0.16 * f;
    shake = 3 + 6 * e;
    if (k >= 1) {
      mergeState = 'flash'; mergeT0 = now; flash = 1;
      burstLight(cx, cy, 90, true);
      rings.push({ x: cx, y: cy, t0: now, warm: true });
    }
  }
 
  if (mergeState === 'flash') {
    const k = clamp((now - mergeT0) / FLASH_T, 0, 1);
    if (k >= 1) { mergeState = 'formed'; mergeT0 = now; sun.visible = false; moon.visible = false; }
  }
 
  if (mergeState === 'formed') {
    // 停留一段時間後，自動裂開讓人再玩一次
    if (now - mergeT0 > 4200 && now - lastSplit > SPLIT_COOLDOWN) startSplit(now);
  }
 
  if (mergeState === 'splitting') {
    const k = clamp((now - mergeT0) / 420, 0, 1), e = easeOut(k);
    sun.x  = cx + (sun.baseX  - cx) * e; sun.y  = cy + (sun.baseY  - cy) * e;
    moon.x = cx + (moon.baseX - cx) * e; moon.y = cy + (moon.baseY - cy) * e;
    if (k >= 1) { mergeState = 'idle'; sun.vx = sun.vy = moon.vx = moon.vy = 0; }
  }
}
 
function mergeThreshold() { return glyphSize * 0.58; }
 
function startSplit(now) {
  mergeState = 'splitting'; mergeT0 = now; lastSplit = now;
  sun.visible = true; moon.visible = true;
  sun.x = moon.x = (sun.x + moon.x) / 2; sun.y = moon.y = (sun.y + moon.y) / 2;
  burstLight(sun.x, sun.y, 70, false);
  rings.push({ x: sun.x, y: sun.y, t0: now, warm: false });
  flash = 0.6; shake = 10;
}
 
function maybeGrabSplit(slot) {
  // 已經合成後，在「明」附近再次捏合／點擊，可以手動拆開重玩
  if (mergeState !== 'formed') return;
  const cx = (sun.x + moon.x) / 2, cy = (sun.y + moon.y) / 2;
  if (Math.hypot(slot.x - cx, slot.y - cy) < glyphSize * 0.6 && performance.now() - lastSplit > SPLIT_COOLDOWN) {
    startSplit(performance.now());
  }
}
 
/* ============================================================
   手部偵測（雙手）
   ============================================================ */
function detectHands() {
  if (!handLandmarker || !cameraOn || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  if (performance.now() - lastDetectT < detectGap) return;   // 裝置較慢時跳過部分畫面，避免整個畫面卡住
  lastVideoTime = video.currentTime;
  let res;
  const t0 = performance.now(); lastDetectT = t0;
  try { res = handLandmarker.detectForVideo(video, t0); } catch { return; }
  // 記錄每次偵測花多久：一次超過 25ms 時，自動拉開偵測間隔（最多約每秒 15 次），讓動畫保持順暢
  detectAvg = detectAvg * 0.9 + (performance.now() - t0) * 0.1;
  detectGap = detectAvg > 25 ? Math.min(66, detectAvg * 1.3) : 0;
 
  const hands = res.landmarks || [];
  const now = performance.now();
  const aspect = video.videoWidth / video.videoHeight || 1;
 
  // 依畫面上的左右位置排序，穩定對應到 h0（畫面左）、h1（畫面右）
  const info = hands.map(lm => {
    let px_ = 0, py_ = 0;
    for (const i of [0, 5, 9, 13, 17]) { px_ += lm[i].x; py_ += lm[i].y; }
    px_ /= 5; py_ /= 5;
    const unit = Math.hypot((lm[9].x - lm[0].x) * aspect, lm[9].y - lm[0].y) || 0.001;
    const pinchDist = Math.hypot((lm[4].x - lm[8].x) * aspect, lm[4].y - lm[8].y) / unit;
    return { lm, sx: (1 - px_) * W, sy: py_ * H, pinchDist };   // 鏡像成使用者視角
  }).sort((a, b) => a.sx - b.sx);
 
  [slots.h0, slots.h1].forEach((slot, i) => {
    const d = info[i];
    if (!d) { slot.active = false; slot.pinching = false; releaseSlot(slot); return; }
    slot.active = true; slot.seen = now;
    slot.x = d.sx; slot.y = d.sy;
    updateSlotVelocity(slot, now);
    const pinching = d.pinchDist < (slot.pinching ? PINCH_OFF : PINCH_ON);
    if (pinching && !slot.pinching) { tryGrab(slot); maybeGrabSplit(slot); }
    if (!pinching && slot.pinching) releaseSlot(slot);
    slot.pinching = pinching;
  });
 
  drawPreview(info.map(d => d.lm));
}
 
// 左下角預覽：白色骨架（與 Level 1 相同樣式）
function drawPreview(list) {
  const box = $('#pv'), w = box.clientWidth, h = box.clientHeight;
  const d = Math.min(2, window.devicePixelRatio || 1);
  if (dots.width !== Math.round(w * d) || dots.height !== Math.round(h * d)) {
    dots.width = Math.round(w * d); dots.height = Math.round(h * d);
  }
  dctx.setTransform(d, 0, 0, d, 0, 0);
  dctx.clearRect(0, 0, w, h);
  dctx.strokeStyle = '#ffffff'; dctx.fillStyle = '#ffffff'; dctx.lineWidth = 1.5; dctx.lineCap = 'round';
  for (const lm of list) {
    for (const [a, b] of CONNECTIONS) {
      dctx.beginPath();
      dctx.moveTo((1 - lm[a].x) * w, lm[a].y * h);
      dctx.lineTo((1 - lm[b].x) * w, lm[b].y * h);
      dctx.stroke();
    }
    for (const p of lm) { dctx.beginPath(); dctx.arc((1 - p.x) * w, p.y * h, 2.2, 0, 6.283); dctx.fill(); }
  }
}
 
/* ============================================================
   物理更新
   ============================================================ */
function updateObject(o, f) {
  if (!o.visible) return;
  if (o.heldBy) {
    const s = o.heldBy;
    o.x += (s.x - o.x) * Math.min(1, FOLLOW * f);
    o.y += (s.y - o.y) * Math.min(1, FOLLOW * f);
    o.vx = 0; o.vy = 0;
  } else {
    const bob = mergeState === 'idle' || mergeState === 'dwell';
    const tx = o.baseX, ty = o.baseY + (bob ? Math.sin(performance.now() * 0.0011 + o.phase) * glyphSize * 0.05 : 0);
    o.vx += (tx - o.x) * SPRING * f;
    o.vy += (ty - o.y) * SPRING * f;
    o.vx *= Math.pow(DAMP, f); o.vy *= Math.pow(DAMP, f);
    o.x += o.vx * f; o.y += o.vy * f;
  }
}
 
function update(f, now) {
  if (slots.mouse.active) updateSlotVelocity(slots.mouse, now);
 
  if (mergeState === 'idle' || mergeState === 'dwell') {
    updateObject(sun, f); updateObject(moon, f);
    if (dist(sun, moon) < mergeThreshold()) {
      if (mergeState === 'idle') { mergeState = 'dwell'; dwellT = 0; }
    } else if (mergeState === 'dwell') { mergeState = 'idle'; dwellT = 0; }
  }
  updateMerge(now, f);
 
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life += f * 16.7;
    if (s.life > s.max) { sparks.splice(i, 1); continue; }
    s.vy += 0.05 * f; s.vx *= Math.pow(0.985, f); s.vy *= Math.pow(0.99, f);
    s.x += s.vx * f; s.y += s.vy * f;
  }
  flash *= Math.pow(0.88, f);
  shake *= Math.pow(0.86, f);
}
 
/* ============================================================
   繪製（白底：光暈與火花改用一般疊加，白底上才看得見）
   ============================================================ */
function glowColor(name) {
  return name === 'amber'     ? '240,169,74'
       : name === 'moonlight' ? '120,175,150'
       : '245,190,110';
}
 
/* 字的光暈與模糊「預先畫好」存起來（sprite），每格只要貼圖。
   Safari 每一格即時計算大範圍 shadowBlur / blur 非常慢，會讓整個畫面卡成一片空白。 */
const GLYPH_GLOW = { '日': 'amber', '月': 'moonlight', '明': 'formed' };
const BLUR_LEVELS = [0, 4, 8, 14];
let sprites = {}, spriteSize = 0;
const canFilter = (() => {
  try { const c = document.createElement('canvas').getContext('2d'); c.filter = 'blur(2px)'; return c.filter === 'blur(2px)'; }
  catch { return false; }
})();
 
function buildSprites() {
  const pad = Math.ceil(glyphSize * 0.45);
  spriteSize = Math.ceil(glyphSize + pad * 2);
  sprites = {};
  for (const ch of Object.keys(GLYPH_GLOW)) {
    const col = glowColor(GLYPH_GLOW[ch]);
    // 清晰版：光暈 + 字本體
    const base = document.createElement('canvas');
    base.width = base.height = Math.ceil(spriteSize * DPR);
    const b = base.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    b.font = `900 ${glyphSize}px ${FONT}`;
    b.textAlign = 'center'; b.textBaseline = 'middle';
    const cx = spriteSize / 2, cy = spriteSize / 2 + glyphSize * 0.03;
    b.shadowColor = `rgba(${col},0.7)`;
    b.shadowBlur = glyphSize * 0.22 * DPR;
    b.fillStyle = `rgba(${col},0.25)`;
    b.fillText(ch, cx, cy);
    b.shadowBlur = 0; b.shadowColor = 'rgba(0,0,0,0)';
    b.fillStyle = 'rgba(51,51,51,1)';
    b.fillText(ch, cx, cy);
 
    // 模糊版：只在這裡算一次
    sprites[ch] = BLUR_LEVELS.map(level => {
      if (level === 0 || !canFilter) return base;
      const c = document.createElement('canvas');
      c.width = c.height = base.width;
      const x = c.getContext('2d');
      x.filter = `blur(${level * DPR}px)`;
      x.drawImage(base, 0, 0);
      return c;
    });
  }
}
 
function drawGlyph(o, blur, alpha, scale) {
  if (!o.visible || alpha <= 0.002) return;
  const list = sprites[o.ch];
  if (!list) return;
  // 選最接近的模糊程度
  let k = 0;
  for (let i = 1; i < BLUR_LEVELS.length; i++) if (Math.abs(BLUR_LEVELS[i] - blur) < Math.abs(BLUR_LEVELS[k] - blur)) k = i;
  const size = spriteSize * scale;
  ctx.globalAlpha = alpha;
  ctx.drawImage(list[k], o.x - size / 2, o.y - size / 2, size, size);
  ctx.globalAlpha = 1;
}
 
function render(now) {
  clearCursorLayer();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
 
  if (flash > 0.01) {
    ctx.fillStyle = `rgba(255,232,190,${0.18 * flash})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.save();
  ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
 
  // 日、月：接近合成時逐漸模糊淡出
  let blur = 0, dimAlpha = 1;
  if (mergeState === 'drawin') {
    const k = clamp((now - mergeT0) / DRAW_IN, 0, 1); blur = 14 * easeOut(k);
  } else if (mergeState === 'flash') {
    const k = clamp((now - mergeT0) / FLASH_T, 0, 1); blur = 14 * (1 - k); dimAlpha = 1 - k;
  } else if (mergeState === 'splitting') {
    const k = clamp((now - mergeT0) / 420, 0, 1); blur = 10 * (1 - easeOut(k));
  }
  const grow = 1 + (mergeState === 'drawin' ? 0.06 * clamp((now - mergeT0) / DRAW_IN, 0, 1) : 0);
  drawGlyph(sun, blur, dimAlpha, grow);
  drawGlyph(moon, blur, dimAlpha, grow);
 
  // 明：合成完成後淡入、緩緩發光
  if (mergeState === 'flash' || mergeState === 'formed' || mergeState === 'splitting') {
    const cx = (sun.x + moon.x) / 2, cy = (sun.y + moon.y) / 2;
    let a = 1, sc = 1;
    if (mergeState === 'flash') { const k = clamp((now - mergeT0) / FLASH_T, 0, 1); a = k; sc = 0.92 + 0.08 * k; }
    if (mergeState === 'formed') { sc = 1 + Math.sin((now - mergeT0) * 0.0016) * 0.02; }
    if (mergeState === 'splitting') { const k = clamp((now - mergeT0) / 420, 0, 1); a = 1 - k; sc = 1 - 0.06 * k; }
    drawGlyph({ ch: '明', x: cx, y: cy, glow: 'formed', visible: true }, 0, a, sc);
  }
 
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], age = now - r.t0;
    if (age > 650) { rings.splice(i, 1); continue; }
    const k = age / 650;
    ctx.strokeStyle = r.warm ? `rgba(240,169,74,${0.55 * (1 - k)})` : `rgba(120,175,150,${0.5 * (1 - k)})`;
    ctx.lineWidth = 0.6 + 4 * (1 - k);
    ctx.beginPath(); ctx.arc(r.x, r.y, 20 + glyphSize * 0.9 * easeOut(k), 0, 6.283); ctx.stroke();
  }
 
  for (const s of sparks) {
    const a = 1 - s.life / s.max;
    ctx.fillStyle = s.warm ? `rgba(240,169,74,${a})` : `rgba(120,175,150,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size * (0.5 + a * 0.5), 0, 6.283); ctx.fill();
  }
 
  drawHandCursor(slots.h0);
  drawHandCursor(slots.h1);
 
  ctx.restore();
}
 
// 發光的橘黃色游標與白色中心點（與 Level 1 相同）；捏合時稍微放大。畫在最上層的游標圖層
function drawHandCursor(slot) {
  if (!slot.active) return;
  drawCursor(slot.x, slot.y, !!(slot.held || slot.pinching));
}
 
/* ============================================================
   回選關：按下按鈕，或任一手部游標停在「回選關」上 0.5 秒
   ============================================================ */
let leaving = false;
function goBackToMenu() {
  if (leaving) return;
  leaving = true;
  if (window.parent && window.parent !== window) window.parent.postMessage('back-to-menu', '*');
  else location.reload();
}
window.goBackToMenu = goBackToMenu;
// 手部游標停在任何按鈕上 0.5 秒 → 觸發該按鈕（同一顆按鈕要先移開才會再觸發一次）
let hoverBtn = null, hoverStart = 0, hoverFired = false;
function checkButtonHover(now, pts) {
  if (leaving) return;
  let hit = null;
  const btns = document.querySelectorAll('.header-bar button, .char-tab');
  for (const p of pts) {
    for (const b of btns) {
      const r = b.getBoundingClientRect(), pad = 8;
      if (p.x >= r.left - pad && p.x <= r.right + pad && p.y >= r.top - pad && p.y <= r.bottom + pad) { hit = b; break; }
    }
    if (hit) break;
  }
  if (hit !== hoverBtn) { hoverBtn = hit; hoverStart = now; hoverFired = false; }
  if (!hit || hoverFired) return;
  if (now - hoverStart > 500) { hoverFired = true; hit.click(); }
}
 
/* ============================================================
   主迴圈
   ============================================================ */
let last = performance.now();
function frame(now) {
  const f = Math.min(2.5, (now - last) / 16.667); last = now;
  detectHands();
  update(f, now);
  render(now);
  checkButtonHover(now, [slots.h0, slots.h1].filter(s => s.active));
  requestAnimationFrame(frame);
}
 
/* ============================================================
   MediaPipe 與鏡頭（從選關畫面進來後自動開啟）
   ============================================================ */
async function initHands() {
  const { HandLandmarker, FilesetResolver } = await import(MP_BUNDLE);
  const fileset = await FilesetResolver.forVisionTasks(MP_WASM);
  const opts = delegate => ({
    baseOptions: { modelAssetPath: MP_MODEL, delegate },
    runningMode: 'VIDEO', numHands: 2,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { handLandmarker = await HandLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch { handLandmarker = await HandLandmarker.createFromOptions(fileset, opts('CPU')); }
}
 
function getSharedStream() {
  try {
    const st = window.parent && window.parent !== window && window.parent.getCameraStream && window.parent.getCameraStream();
    return st && st.active ? st : null;
  } catch { return null; }
}
async function initCamera() {
  // 優先沿用選關畫面已經開啟的鏡頭，進入每個關卡時就不會再跳出「允許使用相機」的詢問
  const shared = getSharedStream();
  const stream = shared || await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  cameraOn = true;
}
 
/* ============================================================
   啟動
   ============================================================ */
(async () => {
  // 先把畫面跑起來，字型下載完成後會自動換上（不等字型，避免網路慢時畫面空白）
  layout(); resetScene();
  requestAnimationFrame(frame);
  // 字型下載完成後，重新畫一次字的 sprite
  document.fonts.load(`900 100px "Noto Serif TC"`, '日月明').then(() => buildSprites()).catch(() => {});
  try {
    await initHands();
    await initCamera();
  } catch (err) {
    console.error('鏡頭或手部偵測啟動失敗（仍可用滑鼠拖曳試玩）：', err);
  }
})();
</script>
&lt;/body>

<script type="module">
/* ============================================================
   Level 3 · 狀態觸發 —— 核心玩法來自 cry.html（對「哭」搔癢 → 笑）
   （套用目前的 UI：白底、上方工具列、提示文字、分頁點、
     左下角視訊視窗、橘黃色發光游標＋白色中心點）
   ============================================================ */
const MP_VERSION = '0.10.14';
const MP_BUNDLE  = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`;
const MP_WASM    = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`;
const MP_MODEL   = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
 
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';
const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[1,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                     [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
 
const BLUE_RGB    = '52,104,178';   // 「哭」：憂鬱的藍
const BLUE_HALO   = '70,130,215';   // 哭的柔和藍色暈影
const ORANGE_RGB  = '245,158,20';   // 「笑」：快樂的橘黃
const ORANGE_HALO = '255,172,40';   // 笑的柔和橘黃暈影
 
const WIGGLE_WINDOW = 650;   // 用最近多久的移動軌跡來判斷「來回擺動」
const WIGGLE_THRESH = 2.1;   // 軌跡長度 / 淨位移，大於這個算是搔癢的擺動
const MIN_PATH      = 70;    // 軌跡至少要有這麼長，避免手抖誤判
const TICKLE_HOLD   = 480;   // 判定為搔癢後，要持續這麼久才觸發
const LAUGH_HOLD    = 4600;  // 笑完之後停留多久，才自動收回變回哭臉
const BURST_OUT     = 420;   // 哭→笑 的轉換動畫時間
const REVERT_T      = 380;   // 笑→哭 的收回動畫時間
const HEADER_OFFSET = 40;    // 字的位置往下移，避開上方工具列
 
const $ = s => document.querySelector(s);
 
/* 效能：平板／手機（觸控裝置，含 iPad）效能較弱，降低畫布解析度、圖片處理尺寸，並在偵測變慢時自動放慢偵測頻率 */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || /iPad|iPhone|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1);
const MAX_DPR = IS_TOUCH ? 1.25 : 2;
let lastDetectT = 0, detectAvg = 0, detectGap = 0;
const canvas = $('#stage'), ctx = canvas.getContext('2d');
const video = $('#cam'), dots = $('#dots'), dctx = dots.getContext('2d');
 
/* 手部游標圖層（疊在「回選關」等按鈕之上） */
const curCanvas = $('#cursor'), cctx = curCanvas.getContext('2d');
function sizeCursorLayer() { curCanvas.width = Math.round(W * DPR); curCanvas.height = Math.round(H * DPR); }
function clearCursorLayer() { cctx.setTransform(DPR, 0, 0, DPR, 0, 0); cctx.clearRect(0, 0, W, H); }
// 發光的橘黃色游標＋白色中心點；big 時（靠近字、正在搔癢）稍微放大
function drawCursor(x, y, big) {
  const rOuter = big ? 38 : 28;
  const gOuter = cctx.createRadialGradient(x, y, 0, x, y, rOuter);
  gOuter.addColorStop(0, 'rgba(245, 160, 60, 0.7)');
  gOuter.addColorStop(1, 'rgba(245, 160, 60, 0)');
  cctx.fillStyle = gOuter;
  cctx.fillRect(x - rOuter, y - rOuter, rOuter * 2, rOuter * 2);
  const rInner = big ? 8 : 6;
  const gInner = cctx.createRadialGradient(x, y, 0, x, y, rInner);
  gInner.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gInner.addColorStop(1, 'rgba(255, 255, 255, 0)');
  cctx.fillStyle = gInner;
  cctx.fillRect(x - rInner, y - rInner, rInner * 2, rInner * 2);

let W = 0, H = 0, DPR = 1, glyphSize = 380;
let cameraOn = false, handLandmarker = null, lastVideoTime = -1;
 
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const glyphCenter = () => ({ x: W / 2, y: H / 2 + HEADER_OFFSET });
 
/* ============================================================
   狀態
   ============================================================ */
let state = 'crying';      // crying | bursting | laughing | reverting
let stateT0 = performance.now();
let tickleDwell = 0;
let handPt = null, handFromCam = false;
const samples = [];        // { t, x, y }，用來判斷是否在快速來回擺動
const rings = [], sparks = [], tears = [];
let flash = 0, shake = 0;
let nextTear = 0, nextTwinkle = 0;
 
function layout() {
  DPR = Math.min(MAX_DPR, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  sizeCursorLayer();
  glyphSize = Math.min(W, H) * 0.42;
  buildSprites();
}
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });
 
function resetScene() {
  state = 'crying'; stateT0 = performance.now(); tickleDwell = 0;
  rings.length = 0; sparks.length = 0; tears.length = 0; flash = 0; shake = 0;
  samples.length = 0;
}
$('#btnReset').addEventListener('click', resetScene);
 
/* ============================================================
   輸入：滑鼠也能在字附近快速搖晃試玩
   ============================================================ */
canvas.addEventListener('pointermove', e => {
  if (handFromCam) return;
  pushSample(performance.now(), e.clientX, e.clientY);
});
canvas.addEventListener('pointerleave', () => { if (!handFromCam) handPt = null; });
 
function pushSample(t, x, y) {
  handPt = { x, y };
  samples.push({ t, x, y });
  while (samples.length && t - samples[0].t > WIGGLE_WINDOW) samples.shift();
}
 
function tickleScore(cx, cy) {
  if (samples.length < 4) return 0;
  const last = samples[samples.length - 1];
  if (Math.hypot(last.x - cx, last.y - cy) > glyphSize * 0.62) return 0;
  let pathLen = 0;
  for (let i = 1; i < samples.length; i++) pathLen += Math.hypot(samples[i].x - samples[i-1].x, samples[i].y - samples[i-1].y);
  const first = samples[0];
  const netDisp = Math.hypot(last.x - first.x, last.y - first.y);
  if (pathLen < MIN_PATH) return 0;
  return (pathLen / (netDisp + 10)) / WIGGLE_THRESH;   // >=1 表示達到門檻
}
 
/* ============================================================
   狀態機
   ============================================================ */
function burst(cx, cy, n, warm) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), sp = rand(3, 12);
    sparks.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0, 2),
      life: 0, max: rand(480, 980), size: rand(1.6, 4), warm });
  }
  if (sparks.length > 460) sparks.splice(0, sparks.length - 460);
}
 
function updateStateMachine(f, now) {
  const { x: cx, y: cy } = glyphCenter();
  const tickling = tickleScore(cx, cy) >= 1;
 
  if (state === 'crying') {
    tickleDwell = tickling ? tickleDwell + f * 16.7 : Math.max(0, tickleDwell - f * 16.7 * 1.4);
    if (tickleDwell > TICKLE_HOLD) { state = 'bursting'; stateT0 = now; }
  } else if (state === 'bursting') {
    if (now - stateT0 >= BURST_OUT) {
      state = 'laughing'; stateT0 = now; tickleDwell = 0;
      flash = 1; shake = 14;
      burst(cx, cy, 100, true);
      rings.push({ x: cx, y: cy, t0: now });
    }
  } else if (state === 'laughing') {
    tickleDwell = tickling ? tickleDwell + f * 16.7 : Math.max(0, tickleDwell - f * 16.7 * 1.4);
    if (tickleDwell > TICKLE_HOLD || now - stateT0 > LAUGH_HOLD) {
      state = 'reverting'; stateT0 = now;
      burst(cx, cy, 26, false);
    }
  } else if (state === 'reverting') {
    if (now - stateT0 >= REVERT_T) { state = 'crying'; stateT0 = now; tickleDwell = 0; }
  }
}
 
/* ============================================================
   手部偵測
   ============================================================ */
/* 骨架平滑：One Euro Filter。只作用在預覽骨架的繪製；游標與搔癢判斷仍使用原始偵測資料。 */
const SKEL_MIN_CUTOFF = 1.5, SKEL_BETA = 40, SKEL_D_CUTOFF = 1.0;
let skelState = null, skelLastT = 0;
const euroAlpha = (cutoff, dt) => 1 / (1 + (1 / (2 * Math.PI * cutoff)) / dt);
function smoothLandmarks(lm, tMs) {
  const t = tMs / 1000;
  if (!skelState) {
    skelState = lm.map(p => ({ x: p.x, y: p.y, dx: 0, dy: 0 }));
    skelLastT = t;
    return lm.map(p => ({ x: p.x, y: p.y }));
  }
  const dt = Math.max(1e-3, t - skelLastT); skelLastT = t;
  const aD = euroAlpha(SKEL_D_CUTOFF, dt);
  return lm.map((p, i) => {
    const s = skelState[i];
    for (const k of ['x', 'y']) {
      const dk = 'd' + k;
      s[dk] += aD * ((p[k] - s[k]) / dt - s[dk]);
      s[k] += euroAlpha(SKEL_MIN_CUTOFF + SKEL_BETA * Math.abs(s[dk]), dt) * (p[k] - s[k]);
    }
    return { x: s.x, y: s.y };
  });
}
 
function detectHands() {
  if (!handLandmarker || !cameraOn || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  if (performance.now() - lastDetectT < detectGap) return;   // 裝置較慢時跳過部分畫面，避免整個畫面卡住
  lastVideoTime = video.currentTime;
  let res;
  const t0 = performance.now(); lastDetectT = t0;
  try { res = handLandmarker.detectForVideo(video, t0); } catch { return; }
  // 記錄每次偵測花多久：一次超過 25ms 時，自動拉開偵測間隔（最多約每秒 15 次），讓動畫保持順暢
  detectAvg = detectAvg * 0.9 + (performance.now() - t0) * 0.1;
  detectGap = detectAvg > 25 ? Math.min(66, detectAvg * 1.3) : 0;
 
  if (res.landmarks && res.landmarks.length) {
    const lm = res.landmarks[0];
    let x = 0, y = 0;
    for (const i of [0, 5, 9, 13, 17]) { x += lm[i].x; y += lm[i].y; }
    x /= 5; y /= 5;
    handFromCam = true;
    pushSample(performance.now(), (1 - x) * W, y * H);
    drawPreview(smoothLandmarks(lm, performance.now()));
  } else {
    if (handFromCam) handPt = null;
    handFromCam = false;
    skelState = null;
    dctx.clearRect(0, 0, dots.width, dots.height);
  }
}
 
// 左下角預覽：白色骨架（與 Level 1、Level 2 相同樣式）
function drawPreview(lm) {
  const box = $('#pv'), w = box.clientWidth, h = box.clientHeight;
  const d = Math.min(2, window.devicePixelRatio || 1);
  if (dots.width !== Math.round(w * d) || dots.height !== Math.round(h * d)) {
    dots.width = Math.round(w * d); dots.height = Math.round(h * d);
  }
  dctx.setTransform(d, 0, 0, d, 0, 0);
  dctx.clearRect(0, 0, w, h);
  dctx.strokeStyle = '#ffffff'; dctx.lineWidth = 1.5; dctx.lineCap = 'round';
  for (const [a, b] of CONNECTIONS) {
    dctx.beginPath();
    dctx.moveTo((1 - lm[a].x) * w, lm[a].y * h);
    dctx.lineTo((1 - lm[b].x) * w, lm[b].y * h);
    dctx.stroke();
  }
  dctx.fillStyle = '#ffffff';
  for (const p of lm) { dctx.beginPath(); dctx.arc((1 - p.x) * w, p.y * h, 2.2, 0, 6.283); dctx.fill(); }
}
 
/* ============================================================
   粒子更新
   ============================================================ */
function update(f, now) {
  updateStateMachine(f, now);
  const { x: cx, y: cy } = glyphCenter();
 
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life += f * 16.7;
    if (s.life > s.max) { sparks.splice(i, 1); continue; }
    s.vy += 0.05 * f; s.vx *= Math.pow(0.985, f); s.vy *= Math.pow(0.99, f);
    s.x += s.vx * f; s.y += s.vy * f;
  }
  for (let i = tears.length - 1; i >= 0; i--) {
    const t = tears[i]; t.life += f * 16.7;
    if (t.life > t.max) { tears.splice(i, 1); continue; }
    t.vy += 0.12 * f; t.y += t.vy * f;
  }
  if (state === 'crying' && now > nextTear) {
    nextTear = now + rand(2600, 4400);
    tears.push({ x: cx - glyphSize * 0.1, y: cy - glyphSize * 0.14, vy: 0.4, life: 0, max: rand(900, 1400) });
  }
  if (state === 'laughing' && now > nextTwinkle) {
    nextTwinkle = now + rand(500, 950);
    const a = rand(0, 6.283), r = glyphSize * rand(0.35, 0.6);
    sparks.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: rand(-0.5, 0.5), vy: -rand(0.6, 1.6),
      life: 0, max: rand(600, 1000), size: rand(1.4, 2.8), warm: true });
  }
 
  flash *= Math.pow(0.88, f);
  shake *= Math.pow(0.86, f);
}
 
/* ============================================================
   字的光暈「預先畫好」存起來（sprite），每格只要貼圖
   （Safari 每格即時算大範圍 shadowBlur 會非常慢）
   ============================================================ */
const HALO_LEVELS = [0.08, 0.14, 0.2, 0.28];
let sprites = {}, spriteSize = 0;
function buildSprites() {
  const pad = Math.ceil(glyphSize * 0.5);
  spriteSize = Math.ceil(glyphSize + pad * 2);
  sprites = {};
  for (const ch of ['哭', '笑']) {
    const laugh = ch === '笑';
    sprites[ch] = HALO_LEVELS.map(haloK => {
      const c = document.createElement('canvas');
      c.width = c.height = Math.ceil(spriteSize * DPR);
      const x = c.getContext('2d');
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
      x.font = `900 ${glyphSize}px ${FONT}`;
      x.textAlign = 'center'; x.textBaseline = 'middle';
      const px = spriteSize / 2, py = spriteSize / 2 + glyphSize * 0.03;
      // 哭＝藍色＋藍色暈影；笑＝橘黃色＋橘黃暈影
      x.shadowColor = `rgba(${laugh ? ORANGE_HALO : BLUE_HALO},.55)`;
      x.shadowBlur = glyphSize * (haloK + 0.06) * DPR;
      x.fillStyle = `rgb(${laugh ? ORANGE_RGB : BLUE_RGB})`;
      x.fillText(ch, px, py);
      x.shadowBlur = 0; x.shadowColor = 'rgba(0,0,0,0)';
      x.fillText(ch, px, py);
      return { haloK, c };
    });
  }
}
 
/* ============================================================
   繪製
   ============================================================ */
function drawGlyph(now) {
  const { x: cx, y: cy } = glyphCenter();
  const t = now * 0.001;
  let ch = '哭', scale = 1, rot = 0, dx = 0, dy = 0, haloK = 0.12;
 
  if (state === 'crying') {
    const wob = clamp(tickleDwell / TICKLE_HOLD, 0, 1);
    dy = Math.sin(t * 1.1) * glyphSize * 0.012 + glyphSize * 0.01;   // 微微下垂的啜泣感
    dx = wob * Math.sin(now * 0.05) * 14;
    rot = wob * Math.sin(now * 0.045) * 0.05;
    scale = 1 + wob * Math.sin(now * 0.06) * 0.02;
    haloK = 0.08 + wob * 0.1;
  } else if (state === 'bursting') {
    const k = clamp((now - stateT0) / BURST_OUT, 0, 1);
    if (k < 0.4) {
      const kk = k / 0.4;
      dx = Math.sin(now * 0.09) * 16 * (1 - kk * 0.3);
      rot = Math.sin(now * 0.08) * 0.12;
      scale = 1 + Math.sin(now * 0.1) * 0.04;
      haloK = 0.12 + 0.12 * kk;
    } else {
      const kk = (k - 0.4) / 0.6;
      ch = '笑';
      scale = 0.9 + 0.14 * easeOut(kk);
      haloK = 0.14 + 0.14 * kk;
    }
  } else if (state === 'laughing') {
    ch = '笑';
    dy = -Math.abs(Math.sin(t * 2.1)) * glyphSize * 0.02;   // 開心彈跳
    scale = 1 + Math.abs(Math.sin(t * 2.1)) * 0.025;
    haloK = 0.16 + Math.sin(t * 2.1) * 0.03;
  } else if (state === 'reverting') {
    const k = clamp((now - stateT0) / REVERT_T, 0, 1);
    ch = k < 0.5 ? '笑' : '哭';
    scale = 1 - 0.08 * Math.sin(k * Math.PI);
    haloK = 0.14 * (1 - k) + 0.08 * k;
  }
 
  const list = sprites[ch];
  if (!list) return;
  let best = list[0];
  for (const s of list) if (Math.abs(s.haloK - haloK) < Math.abs(best.haloK - haloK)) best = s;
 
  ctx.save();
  ctx.translate(cx + dx, cy + dy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.drawImage(best.c, -spriteSize / 2, -spriteSize / 2, spriteSize, spriteSize);
  ctx.restore();
}
 
function drawTears() {
  for (const t of tears) {
    const a = 1 - t.life / t.max;
    ctx.fillStyle = `rgba(${BLUE_HALO},${0.8 * a})`;
    ctx.beginPath(); ctx.ellipse(t.x, t.y, 3.2, 5.2, 0, 0, 6.283); ctx.fill();
  }
}
 
function drawRings(now) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], age = now - r.t0;
    if (age > 620) { rings.splice(i, 1); continue; }
    const k = age / 620;
    ctx.strokeStyle = `rgba(${ORANGE_RGB},${0.55 * (1 - k)})`;
    ctx.lineWidth = 0.6 + 4 * (1 - k);
    ctx.beginPath(); ctx.arc(r.x, r.y, 20 + glyphSize * 0.85 * easeOut(k), 0, 6.283); ctx.stroke();
  }
}
 
function drawSparks() {
  for (const s of sparks) {
    const a = 1 - s.life / s.max;
    ctx.fillStyle = s.warm ? `rgba(${ORANGE_RGB},${0.9 * a})` : `rgba(${BLUE_HALO},${0.8 * a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size * (0.5 + a * 0.5), 0, 6.283); ctx.fill();
  }
}
 
function render(now) {
  clearCursorLayer();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
 
  if (flash > 0.01) {
    ctx.fillStyle = `rgba(255,232,190,${0.18 * flash})`;   // 笑出來時的亮閃
    ctx.fillRect(0, 0, W, H);
  }
 
  ctx.save();
  ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawGlyph(now);
  drawTears();
  drawRings(now);
  drawSparks();
  ctx.restore();
 
  // 手部游標（畫在最上層的游標圖層，會蓋過按鈕）；靠近字時稍微放大
  if (handFromCam && handPt) {
    const { x: cx, y: cy } = glyphCenter();
    drawCursor(handPt.x, handPt.y, tickleScore(cx, cy) > 0);
  }
}
 
/* ============================================================
   回選關：按下按鈕，或手部游標停在「回選關」上 0.5 秒
   ============================================================ */
let leaving = false;
function goBackToMenu() {
  if (leaving) return;
  leaving = true;
  if (window.parent && window.parent !== window) window.parent.postMessage('back-to-menu', '*');
  else location.reload();
}
window.goBackToMenu = goBackToMenu;
// 手部游標停在任何按鈕上 0.5 秒 → 觸發該按鈕（同一顆按鈕要先移開才會再觸發一次）
let hoverBtn = null, hoverStart = 0, hoverFired = false;
function checkButtonHover(now, pts) {
  if (leaving) return;
  let hit = null;
  const btns = document.querySelectorAll('.header-bar button, .char-tab');
  for (const p of pts) {
    for (const b of btns) {
      const r = b.getBoundingClientRect(), pad = 8;
      if (p.x >= r.left - pad && p.x <= r.right + pad && p.y >= r.top - pad && p.y <= r.bottom + pad) { hit = b; break; }
    }
    if (hit) break;
  }
  if (hit !== hoverBtn) { hoverBtn = hit; hoverStart = now; hoverFired = false; }
  if (!hit || hoverFired) return;
  if (now - hoverStart > 500) { hoverFired = true; hit.click(); }
}
 
/* ============================================================
   主迴圈
   ============================================================ */
let last = performance.now();
function frame(now) {
  const f = Math.min(2.5, (now - last) / 16.667); last = now;
  detectHands();
  update(f, now);
  render(now);
  checkButtonHover(now, handFromCam && handPt ? [handPt] : []);
  requestAnimationFrame(frame);
}
 
/* ============================================================
   MediaPipe 與鏡頭（從選關畫面進來後自動開啟）
   ============================================================ */
async function initHands() {
  const { HandLandmarker, FilesetResolver } = await import(MP_BUNDLE);
  const fileset = await FilesetResolver.forVisionTasks(MP_WASM);
  const opts = delegate => ({
    baseOptions: { modelAssetPath: MP_MODEL, delegate },
    runningMode: 'VIDEO', numHands: 1,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { handLandmarker = await HandLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch { handLandmarker = await HandLandmarker.createFromOptions(fileset, opts('CPU')); }
}
 
function getSharedStream() {
  try {
    const st = window.parent && window.parent !== window && window.parent.getCameraStream && window.parent.getCameraStream();
    return st && st.active ? st : null;
  } catch { return null; }
}
async function initCamera() {
  // 優先沿用選關畫面已經開啟的鏡頭，進入每個關卡時就不會再跳出「允許使用相機」的詢問
  const shared = getSharedStream();
  const stream = shared || await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  cameraOn = true;
}
 
/* ============================================================
   啟動
   ============================================================ */
(async () => {
  layout(); resetScene();
  requestAnimationFrame(frame);
  // 字型下載完成後，重新畫一次字的 sprite
  document.fonts.load(`900 100px "Noto Sans TC"`, '哭笑').then(() => buildSprites()).catch(() => {});
  try {
    await initHands();
    await initCamera();
  } catch (err) {
    console.error('鏡頭或手部偵測啟動失敗（仍可用滑鼠在字旁快速搖晃試玩）：', err);
  }
})();

                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    iframe.style.zIndex = '999';
                    iframe.style.background = '#ffffff';
                    iframe.setAttribute('allow', 'camera; microphone');
 
                    // 設定 iframe 起始為透明，準備淡入
                    iframe.style.opacity = '0';
                    iframe.style.transition = 'opacity 0.6s ease';
 
                    // 關卡載入完成（或最多等 1.5 秒）後才淡入，並移除放大的卡片
                    let shown = false;
                    const reveal = () => {
                        if (shown) return;
                        shown = true;
                        iframe.style.opacity = '1';
                        zoom.style.opacity = '0';
                        setTimeout(() => zoom.remove(), 700);
                    };
                    iframe.addEventListener('load', () => setTimeout(reveal, 50));
                    setTimeout(reveal, 1500);
 
                    iframe.srcdoc = source.value;
                    document.body.appendChild(iframe);
                    currentLevelFrame = iframe;
                    mainMenu.style.display = 'none';
                } catch (err) {
                    // 關卡載入失敗時，不要留下空白畫面：移除轉場並回到選關
                    console.error('關卡載入失敗：', err);
                    zoom.remove();
                    cards.forEach(c => { c.style.visibility = ''; });
                    mainMenu.style.display = '';
                    mainMenu.style.opacity = '1';
                    isClapped = false;
                    handsWereApart = false;
                    menuActive = true;
                }
            }, 850);
        }
 
        // === 從關卡回到選擇關卡畫面（關卡內按「回選關」或手部游標停在「回選關」上）===
        function backToMenu() {
            const iframe = currentLevelFrame;
            if (!iframe) return;
            currentLevelFrame = null;
            const mainMenu = document.getElementById('main-menu');
            cards.forEach(c => { c.style.visibility = ''; });
            mainMenu.style.transition = 'none';
            mainMenu.style.opacity = '0';
            mainMenu.style.display = '';
            iframe.style.transition = 'opacity 0.5s ease';
            iframe.style.opacity = '0';
            requestAnimationFrame(() => requestAnimationFrame(() => {
                mainMenu.style.transition = 'opacity 0.5s ease';
                mainMenu.style.opacity = '1';
            }));
            setTimeout(() => {
                iframe.remove();   // 移除關卡，同時釋放關卡內的鏡頭
                // 重置手勢狀態，必須重新選卡、再拍手才會進關
                isClapped = false;
                handsWereApart = false;
                hoverStartTime = Date.now();
                lastDir = null;
                menuActive = true;
            }, 500);
        }
        window.addEventListener('message', e => {
            if (currentLevelFrame && e.source === currentLevelFrame.contentWindow && e.data === 'back-to-menu') backToMenu();
        });
 
        function onResults(results) {
            if (!menuActive) return;
 
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                drawConnectors(canvasCtx, results.multiHandLandmarks[0], HAND_CONNECTIONS, {color: '#FFFFFF', lineWidth: 3});
                drawLandmarks(canvasCtx, results.multiHandLandmarks[0], {color: '#FFFFFF', fillColor: '#FFFFFF', lineWidth: 1, radius: 3});
                
                if (results.multiHandLandmarks.length > 1) {
                    drawConnectors(canvasCtx, results.multiHandLandmarks[1], HAND_CONNECTIONS, {color: '#FFFFFF', lineWidth: 3});
                    drawLandmarks(canvasCtx, results.multiHandLandmarks[1], {color: '#FFFFFF', fillColor: '#FFFFFF', lineWidth: 1, radius: 3});
                }
 
                const hand1 = results.multiHandLandmarks[0];
                // 依食指指向（上下左右）決定要選的卡片
                // 卡片排列：0 左上、1 右上、2 左下、3 右下
                const dir = stableDirection(hand1, (videoElement.videoWidth / videoElement.videoHeight) || (4 / 3));
                let targetIndex = -1;
                if (dir) {
                    const activeIndex = Array.from(cards).findIndex(c => c.classList.contains('active'));
                    let row = Math.floor(activeIndex / 2), col = activeIndex % 2;
                    if (dir === 'left')  col = 0;
                    if (dir === 'right') col = 1;
                    if (dir === 'up')    row = 0;
                    if (dir === 'down')  row = 1;
                    targetIndex = row * 2 + col;
                }
 
                // 雙手同時入鏡（準備拍手）時鎖定目前選定的卡片，避免拍手動作把選取移走
                if (results.multiHandLandmarks.length === 1) {
                    if (targetIndex !== currentHoverIndex) {
                        currentHoverIndex = targetIndex;
                        hoverStartTime = Date.now();
                    } else if (currentHoverIndex !== -1) {
                        if (Date.now() - hoverStartTime > 700) {
                            if (!cards[currentHoverIndex].classList.contains('active')) {
                                // 選取改變：之前的「分開」不算數，必須選定後重新分開再拍合
                                handsWereApart = false;
                            }
                            cards.forEach(card => card.classList.remove('active'));
                            cards[currentHoverIndex].classList.add('active');
                        }
                    }
                } else {
                    hoverStartTime = Date.now();
                }
 
                if (results.multiHandLandmarks.length === 2) {
                    const hand2 = results.multiHandLandmarks[1];
                    const dx = hand1[9].x - hand2[9].x;
                    const dy = hand1[9].y - hand2[9].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
 
                    // 只有在 Level 1 卡片已選定之後的「分開」才算拍手的起手
                    if (distance > 0.3 && (cards[0].classList.contains('active') || cards[1].classList.contains('active') || cards[2].classList.contains('active') || cards[3].classList.contains('active'))) {
                        handsWereApart = true;
                    }
                    
                    if (distance < 0.15 && handsWereApart) {
                        if (cards[0].classList.contains('active') && !isClapped) {
                            isClapped = true;
                            handsWereApart = false;
                            startLevel0();
                        } else if (cards[1].classList.contains('active') && !isClapped) {
                            isClapped = true;
                            handsWereApart = false; 
                            startLevel1(); 
                        } else if (cards[2].classList.contains('active') && !isClapped) {
                            isClapped = true;
                            handsWereApart = false;
                            startLevel2();
                        } else if (cards[3].classList.contains('active') && !isClapped) {
                            isClapped = true;
                            handsWereApart = false;
                            startLevel3();
                        }
                    }
                }
            } else {
                hoverStartTime = Date.now();
            }
            canvasCtx.restore();
        }
 
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        // 平板／手機效能較弱：改用較輕量的手部模型
        const IS_TOUCH = matchMedia('(pointer: coarse)').matches || /iPad|iPhone|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1);
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: IS_TOUCH ? 0 : 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);
 
        // 讓各關卡沿用這裡已開啟的鏡頭，不必每進一關就重新詢問相機權限
        window.getCameraStream = () => videoElement.srcObject;
 
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (menuActive) await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
